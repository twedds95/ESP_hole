[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
lib_deps = 
	lib/DNSServer
	ottowinter/ESPAsyncWebServer-esphome@^3.1.0
	wnatth3/WiFiManager @ ^2.0.16-rc.2
board_build.partitions = partitions_1m_app_3m_spiffs.csv
board_build.filesystem = spiffs